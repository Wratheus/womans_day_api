# ===== Common settings (all profiles) =====

# Server
server.address=0.0.0.0
server.port=8080

# Tomcat — лимиты для multipart (в 3.5 по умолчанию max-part-count=10)
server.tomcat.max-part-count=200
server.tomcat.max-parameter-count=10000
server.tomcat.max-swallow-size=-1
spring.servlet.multipart.location=/tmp
spring.servlet.multipart.file-size-threshold=0

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# JSON format
spring.jackson.property-naming-strategy=LOWER_CAMEL_CASE
spring.jackson.serialization.write-enums-using-to-string=false

# PostgreSQL
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# ddl-auto is set per profile (dev=update, prod=validate)

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Multipart (photos)
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=500MB

# Media storage
app.media.storage-dir=${MEDIA_DIR:./media}

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRY:3600000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRY:604800000}

# Admin credentials
admin.login=${ADMIN_LOGIN}
admin.password=${ADMIN_PASSWORD}

cors.allowed-origins=${CORS_ORIGINS}