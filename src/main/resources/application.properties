# ===== Common settings (all profiles) =====

# Server
server.address=0.0.0.0
server.port=8080

# JSON format
spring.jackson.property-naming-strategy=LOWER_CAMEL_CASE
spring.jackson.serialization.write-enums-using-to-string=false

# PostgreSQL
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Multipart (photos)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Photo storage
app.photos.storage-dir=${PHOTOS_DIR:./photos}

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRY:3600000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRY:604800000}

# Admin credentials
admin.login=${ADMIN_LOGIN}
admin.password=${ADMIN_PASSWORD}

cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:8080,http://localhost:8081}

# Actuator
management.endpoints.web.base-path=/internal/monitor
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
