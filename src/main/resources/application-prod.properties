# ===== PROD profile =====

# Prod database
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.jpa.hibernate.ddl-auto=update

# No SQL logging
spring.jpa.show-sql=false

# Logging — only warnings and errors
logging.level.root=WARN
logging.level.com.womansday.api=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

# Error details — hide internals
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# Swagger — disabled in prod
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

spring.h2.console.enabled=false

# Actuator — limited in prod
management.endpoints.web.exposure.include=health,info,metrics,httpexchanges

# App info
info.app.name=WomansDay API
info.app.environment=prod
