# ===== PROD profile =====

# Prod database (separate file)
spring.datasource.url=jdbc:sqlite:womansday-prod.db

# No SQL logging
spring.jpa.show-sql=false

# Logging — only warnings and errors
logging.level.root=WARN
logging.level.com.womansday.api=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

# Error details — hide internals
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# App info
info.app.name=WomansDay API
info.app.environment=prod
