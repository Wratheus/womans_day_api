# ===== DEV profile =====

# Dev database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:womansday_dev}

# Verbose SQL logging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.root=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.web=DEBUG
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{36} - %msg%n

# Error details
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always

# Actuator — full access in dev
management.endpoint.httpexchanges.access=unrestricted

# App info
info.app.name=WomansDay API
info.app.environment=dev
