# ===== Common settings (all profiles) =====

# Server
server.address=0.0.0.0
server.port=8080


# JSON format
spring.jackson.property-naming-strategy=LOWER_CAMEL_CASE
spring.jackson.serialization.write-enums-using-to-string=false

# SQLite common
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update

# Multipart (photos)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# JWT (override in prod!)
jwt.secret=WomansDay8MarchSuperSecretKey2026ForJwtTokenGeneration
jwt.expiration-ms=86400000

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,httpexchanges
management.endpoint.health.show-details=when-authorized
management.endpoint.httpexchanges.access=unrestricted
management.info.env.enabled=true

# Default profile
spring.profiles.active=dev
