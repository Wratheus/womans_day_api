<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WomansDay Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }

        /* Loading screen */
        .loading-screen { position: fixed; inset: 0; background: #0f172a; display: flex; align-items: center; justify-content: center; z-index: 200; }
        .loading-spinner { width: 40px; height: 40px; border: 3px solid #334155; border-top-color: #f472b6; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Login */
        .login-overlay { position: fixed; inset: 0; background: #0f172a; display: flex; align-items: center; justify-content: center; z-index: 100; }
        .login-box { background: #1e293b; padding: 2rem; border-radius: 12px; width: 340px; }
        .login-box h2 { margin-bottom: 1rem; color: #f472b6; }
        .login-box input { width: 100%; padding: 0.6rem 0.8rem; margin-bottom: 0.8rem; border: 1px solid #334155; border-radius: 8px; background: #0f172a; color: #e2e8f0; font-size: 0.95rem; }
        .login-box button { width: 100%; padding: 0.7rem; background: #f472b6; color: #0f172a; border: none; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; }
        .login-box button:hover { background: #f9a8d4; }
        .login-error { color: #f87171; font-size: 0.85rem; margin-bottom: 0.5rem; display: none; }

        /* Layout */
        .header { background: #1e293b; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .header h1 { font-size: 1.3rem; color: #f472b6; }
        .header .env-badge { padding: 0.25rem 0.75rem; border-radius: 99px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
        .env-dev { background: #fbbf24; color: #0f172a; }
        .env-prod { background: #f87171; color: #fff; }
        .header button { background: #334155; color: #94a3b8; border: none; padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }

        .dashboard { padding: 1.5rem; max-width: 1400px; margin: 0 auto; }

        /* Cards row */
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
        .card { background: #1e293b; border-radius: 12px; padding: 1.2rem; }
        .card .label { color: #94a3b8; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .card .value { font-size: 1.8rem; font-weight: 700; margin-top: 0.3rem; }
        .card .value.green { color: #4ade80; }
        .card .value.pink { color: #f472b6; }
        .card .value.blue { color: #60a5fa; }
        .card .value.yellow { color: #fbbf24; }

        /* Sections */
        .section { background: #1e293b; border-radius: 12px; padding: 1.2rem; margin-bottom: 1.5rem; }
        .section h3 { color: #f472b6; margin-bottom: 1rem; font-size: 1rem; }

        /* Table */
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th { text-align: left; padding: 0.6rem 0.8rem; color: #94a3b8; border-bottom: 1px solid #334155; font-weight: 500; }
        td { padding: 0.6rem 0.8rem; border-bottom: 1px solid #1e293b; }
        tr:hover td { background: #334155; }

        .badge { padding: 0.15rem 0.5rem; border-radius: 99px; font-size: 0.75rem; font-weight: 600; }
        .badge-pending { background: #fbbf2433; color: #fbbf24; }
        .badge-approved { background: #4ade8033; color: #4ade80; }
        .badge-rejected { background: #f8717133; color: #f87171; }

        .badge-get { background: #60a5fa33; color: #60a5fa; }
        .badge-post { background: #4ade8033; color: #4ade80; }
        .badge-patch { background: #fbbf2433; color: #fbbf24; }
        .badge-delete { background: #f8717133; color: #f87171; }

        .status-2xx { color: #4ade80; }
        .status-4xx { color: #fbbf24; }
        .status-5xx { color: #f87171; }

        /* Refresh indicator */
        .refresh-bar { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem; }
        .refresh-bar .dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .refresh-bar span { color: #64748b; font-size: 0.8rem; }

        /* Tabs */
        .tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
        .tab { padding: 0.4rem 1rem; border-radius: 8px; background: #334155; color: #94a3b8; border: none; cursor: pointer; font-size: 0.85rem; }
        .tab.active { background: #f472b6; color: #0f172a; font-weight: 600; }

        .hidden { display: none !important; }
        .mono { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.8rem; }

        /* Review buttons */
        .btn-sm { padding: 0.2rem 0.5rem; border: none; border-radius: 4px; font-size: 0.75rem; font-weight: 600; cursor: pointer; margin-right: 0.3rem; }
        .btn-approve { background: #4ade8033; color: #4ade80; }
        .btn-approve:hover { background: #4ade8055; }
        .btn-reject { background: #f8717133; color: #f87171; }
        .btn-reject:hover { background: #f8717155; }
    </style>
</head>
<body>

<!-- Loading screen (shown first to prevent login form flicker) -->
<div class="loading-screen" id="loadingScreen">
    <div class="loading-spinner"></div>
</div>

<!-- Login (hidden by default) -->
<div class="login-overlay hidden" id="loginOverlay">
    <div class="login-box">
        <h2>Admin Panel</h2>
        <div class="login-error" id="loginError">Invalid login or password</div>
        <input type="text" id="loginInput" placeholder="Login">
        <input type="password" id="passwordInput" placeholder="Password">
        <button onclick="doLogin()">Sign In</button>
    </div>
</div>

<!-- Main -->
<div id="app" class="hidden">
    <div class="header">
        <div style="display:flex;align-items:center;gap:1rem;">
            <h1>WomansDay Admin</h1>
            <span class="env-badge" id="envBadge">...</span>
        </div>
        <button onclick="doLogout()">Logout</button>
    </div>

    <div class="dashboard">
        <div class="refresh-bar">
            <div class="dot"></div>
            <span>Auto-refresh every 5s &bull; <span id="lastUpdate">-</span></span>
        </div>

        <!-- Summary cards -->
        <div class="cards">
            <div class="card"><div class="label">Users</div><div class="value blue" id="userCount">-</div></div>
            <div class="card"><div class="label">Submissions</div><div class="value pink" id="submissionCount">-</div></div>
            <div class="card"><div class="label">Pending Review</div><div class="value yellow" id="pendingCount">-</div></div>
            <div class="card"><div class="label">Budget</div><div class="value green" id="budgetText">-</div></div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab active" onclick="switchTab('submissions')">Submissions</button>
            <button class="tab" onclick="switchTab('requests')">HTTP Requests</button>
            <button class="tab" onclick="switchTab('health')">System</button>
        </div>

        <!-- Submissions -->
        <div class="section" id="tab-submissions">
            <h3>Task Submissions</h3>
            <table>
                <thead>
                    <tr><th>ID</th><th>Task</th><th>Submitter</th><th>Department</th><th>Status</th><th>Time</th><th>Actions</th></tr>
                </thead>
                <tbody id="submissionsBody"></tbody>
            </table>
        </div>

        <!-- HTTP requests -->
        <div class="section hidden" id="tab-requests">
            <h3>Recent HTTP Requests</h3>
            <table>
                <thead>
                    <tr><th>Time</th><th>Method</th><th>URI</th><th>Status</th><th>Duration (ms)</th></tr>
                </thead>
                <tbody id="requestsBody"></tbody>
            </table>
        </div>

        <!-- Health -->
        <div class="section hidden" id="tab-health">
            <h3>System Health</h3>
            <div class="cards" id="healthCards"></div>
            <h3 style="margin-top:1rem">JVM Metrics</h3>
            <div class="cards" id="metricsCards"></div>
        </div>
    </div>
</div>

<script>
    const BASE = window.location.origin;
    let token = localStorage.getItem('admin_token');
    let refreshToken = localStorage.getItem('admin_refresh_token');
    let refreshInterval;

    // --- XSS protection ---
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // --- Auth ---
    async function doLogin() {
        const login = document.getElementById('loginInput').value;
        const password = document.getElementById('passwordInput').value;
        try {
            const res = await fetch(`${BASE}/api/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ login, password })
            });
            if (!res.ok) throw new Error();
            const data = await res.json();
            if (data.role !== 'admin') {
                document.getElementById('loginError').textContent = 'Admin access only';
                document.getElementById('loginError').style.display = 'block';
                return;
            }
            token = data.accessToken;
            refreshToken = data.refreshToken;
            localStorage.setItem('admin_token', token);
            localStorage.setItem('admin_refresh_token', refreshToken);
            showApp();
        } catch {
            document.getElementById('loginError').style.display = 'block';
        }
    }

    async function doLogout() {
        if (refreshToken) {
            try {
                await fetch(`${BASE}/api/auth/logout`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ refreshToken })
                });
            } catch {}
        }
        token = null;
        refreshToken = null;
        localStorage.removeItem('admin_token');
        localStorage.removeItem('admin_refresh_token');
        document.getElementById('app').classList.add('hidden');
        document.getElementById('loginOverlay').classList.remove('hidden');
        clearInterval(refreshInterval);
    }

    function showApp() {
        document.getElementById('loadingScreen').classList.add('hidden');
        document.getElementById('loginOverlay').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
        refreshAll();
        refreshInterval = setInterval(refreshAll, 5000);
    }

    function showLogin() {
        document.getElementById('loadingScreen').classList.add('hidden');
        document.getElementById('loginOverlay').classList.remove('hidden');
    }

    async function api(path) {
        const res = await fetch(`${BASE}${path}`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.status === 401 || res.status === 403) { doLogout(); throw new Error('unauthorized'); }
        return res.json();
    }

    async function apiPatch(path, body) {
        const res = await fetch(`${BASE}${path}`, {
            method: 'PATCH',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(body)
        });
        if (res.status === 401 || res.status === 403) { doLogout(); throw new Error('unauthorized'); }
        return res.json();
    }

    // --- Data loading ---
    async function refreshAll() {
        document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
        await Promise.allSettled([
            loadSummary(),
            loadSubmissions(),
            loadRequests(),
            loadHealth(),
            loadMetrics(),
            loadEnv()
        ]);
    }

    async function loadSummary() {
        try {
            const [users, budget, submissions] = await Promise.all([
                api('/api/users'),
                api('/api/tasks/budget'),
                api('/api/admin/submissions')
            ]);
            document.getElementById('userCount').textContent = users.length;
            document.getElementById('submissionCount').textContent = submissions.length;
            document.getElementById('pendingCount').textContent = submissions.filter(s => s.status === 'pending').length;
            document.getElementById('budgetText').textContent = `${budget.approvedBudget} / ${budget.totalBudget}`;
        } catch {}
    }

    async function loadSubmissions() {
        try {
            const data = await api('/api/admin/submissions');
            const tbody = document.getElementById('submissionsBody');
            tbody.innerHTML = data.slice(0, 50).map(s => {
                const name = s.submitterFirstName
                    ? escapeHtml(s.submitterFirstName) + ' ' + escapeHtml(s.submitterLastName)
                    : escapeHtml(s.submitterLogin);
                const actions = s.status === 'pending'
                    ? `<button class="btn-sm btn-approve" onclick="reviewSubmission(${s.id}, true)">Approve</button>` +
                      `<button class="btn-sm btn-reject" onclick="reviewSubmission(${s.id}, false)">Reject</button>`
                    : '';
                return `
                    <tr>
                        <td class="mono">${s.id}</td>
                        <td>${escapeHtml(s.taskTitle)}</td>
                        <td>${name}</td>
                        <td>${escapeHtml(s.submitterDepartment)}</td>
                        <td><span class="badge badge-${s.status.toLowerCase()}">${s.status}</span></td>
                        <td class="mono">${new Date(s.createdAtEpoch).toLocaleString()}</td>
                        <td>${actions}</td>
                    </tr>
                `;
            }).join('');
        } catch {}
    }

    async function reviewSubmission(id, approved) {
        try {
            await apiPatch(`/api/admin/submissions/${id}/review`, { approved });
            await Promise.allSettled([loadSummary(), loadSubmissions()]);
        } catch {}
    }

    async function loadRequests() {
        try {
            const data = await api('/internal/monitor/httpexchanges');
            const tbody = document.getElementById('requestsBody');
            const exchanges = (data.exchanges || [])
                .reverse()
                .filter(e => !e.request.uri.includes('/internal/monitor/'))
                .slice(0, 100);
            tbody.innerHTML = exchanges.map(e => {
                const method = e.request.method;
                const uri = e.request.uri.replace(BASE, '');
                const status = e.response.status;
                const duration = e.timeTaken ? (e.timeTaken.replace('PT', '').replace('S', '') * 1000).toFixed(0) : '-';
                const statusClass = status < 300 ? 'status-2xx' : status < 500 ? 'status-4xx' : 'status-5xx';
                return `
                    <tr>
                        <td class="mono">${new Date(e.timestamp).toLocaleTimeString()}</td>
                        <td><span class="badge badge-${method.toLowerCase()}">${method}</span></td>
                        <td class="mono">${escapeHtml(uri)}</td>
                        <td class="${statusClass}">${status}</td>
                        <td class="mono">${duration}</td>
                    </tr>
                `;
            }).join('');
        } catch {}
    }

    async function loadHealth() {
        try {
            const data = await api('/internal/monitor/health');
            const container = document.getElementById('healthCards');
            const status = data.status;
            container.innerHTML = `
                <div class="card">
                    <div class="label">Status</div>
                    <div class="value ${status === 'UP' ? 'green' : 'pink'}">${escapeHtml(status)}</div>
                </div>
            `;
            if (data.components) {
                for (const [name, comp] of Object.entries(data.components)) {
                    container.innerHTML += `
                        <div class="card">
                            <div class="label">${escapeHtml(name)}</div>
                            <div class="value ${comp.status === 'UP' ? 'green' : 'pink'}" style="font-size:1.2rem">${escapeHtml(comp.status)}</div>
                        </div>
                    `;
                }
            }
        } catch {}
    }

    async function loadMetrics() {
        try {
            const [mem, threads, cpu] = await Promise.allSettled([
                api('/internal/monitor/metrics/jvm.memory.used'),
                api('/internal/monitor/metrics/jvm.threads.live'),
                api('/internal/monitor/metrics/process.cpu.usage')
            ]);
            const container = document.getElementById('metricsCards');
            let html = '';
            if (mem.status === 'fulfilled') {
                const mb = (mem.value.measurements[0].value / 1048576).toFixed(0);
                html += `<div class="card"><div class="label">JVM Memory</div><div class="value blue">${mb} MB</div></div>`;
            }
            if (threads.status === 'fulfilled') {
                html += `<div class="card"><div class="label">Threads</div><div class="value blue">${threads.value.measurements[0].value}</div></div>`;
            }
            if (cpu.status === 'fulfilled') {
                const pct = (cpu.value.measurements[0].value * 100).toFixed(1);
                html += `<div class="card"><div class="label">CPU</div><div class="value blue">${pct}%</div></div>`;
            }
            container.innerHTML = html;
        } catch {}
    }

    async function loadEnv() {
        try {
            const data = await api('/internal/monitor/info');
            const env = data.app?.environment || 'unknown';
            const badge = document.getElementById('envBadge');
            badge.textContent = env;
            badge.className = `env-badge env-${env}`;
        } catch {}
    }

    // --- Tabs ---
    function switchTab(name) {
        document.querySelectorAll('.tabs .tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('[id^="tab-"]').forEach(t => t.classList.add('hidden'));
        document.getElementById(`tab-${name}`).classList.remove('hidden');
        event.target.classList.add('active');
    }

    // --- Init ---
    document.getElementById('passwordInput').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

    if (token) {
        // Validate saved token — loading screen is shown meanwhile
        fetch(`${BASE}/api/users`, { headers: { 'Authorization': `Bearer ${token}` } })
            .then(r => { if (r.ok) showApp(); else showLogin(); })
            .catch(() => showLogin());
    } else {
        showLogin();
    }
</script>
</body>
</html>
